name: bms-alert
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (the minimum)
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python alert.py
        env:
          BMS_URL: ${{ secrets.BMS_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
